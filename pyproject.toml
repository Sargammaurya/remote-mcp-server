[project]
name = "bruin-mcp-service"
version = "0.1.0"
description = "Shared Bruin MCP service: Bruin data preparation exposed to remote Swarn clients"
requires-python = ">=3.12,<3.13"
# Direct dependencies are pinned exactly; uv.lock pins the rest.
# duckdb must match the DuckDB build Bruin v0.11.780 uses (its ADBC driver
# is duckdb_linux_amd64_v1.5.2) so both read the same database files.
dependencies = [
    "mcp==1.28.1",
    "pydantic==2.14.1",
    "duckdb==1.5.2",
    "sqlglot==30.24.0",
    "openpyxl==3.1.5",
    # asset headers are YAML; written with safe_dump, never by string formatting
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bruin_mcp_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
